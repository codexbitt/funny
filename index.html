<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ek Zaroori Sawal ❤️</title>

<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #ffe6e6;
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    overflow: hidden;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 20px;
    width: 90%;
    max-width: 450px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

h1 {
    color: #d63384;
    font-size: 28px;
}

p {
    font-size: 20px;
    color: purple ;
    background: #ffe6e6;
    padding: 6px 1px;
    border-radius: 8px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
    
}

button {
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

#yesBtn {
    background: #28a745;
    color: white;
}

#noBtn {
    background: #dc3545;
    color: white;
    position: absolute;
}
#noBtn {
    background: #dc3545;
    color: white;
    position: absolute;
    transition: left 0.4s ease, top 0.4s ease; /* 🔥 smooth movement */
}
#success-message {
    display: none;
}

/* Emoji rain */
.emoji {
    position: absolute;
    font-size: 24px;
    animation: fall linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-50px); }
    100% { transform: translateY(100vh); }
}
</style>
</head>

<body>

<div id="main-content" class="container">
    <h1>Hello Meri Meenu 😘</h1>
    <h1>Kya tum meri banna chahogi? ❤️</h1>
    <p id="funText">(Soch samajh ke 😏)</p>

    <div class="buttons">
        <button id="yesBtn" onclick="handleYes()">Haan!</button>
        <button id="noBtn" ontouchstart="moveNo()" onmouseover="moveNo()">Nahi</button>
    </div>
</div>

<div id="success-message" class="container">
    <h1>Ab tum bhaag nahi sakti 🤓❤️</h1>
    <p>Finally maan hi gayi 😍</p>
</div>

<script>
let yesClicks = 0;
let yesSize = 16;

let messages = [
    "Arey soch le 😂",
    "Galat button hai 😏",
    "Sach me?? 😳",
    "Try harder 😈",
    "Nahi allowed 🤠"
];

// NO BUTTON bhaagega
function moveNo() {
    const noBtn = document.getElementById("noBtn");
    const funText = document.getElementById("funText");
    const yesBtn = document.getElementById("yesBtn");

    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 100);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    funText.innerText = messages[Math.floor(Math.random()*messages.length)];

    // Yes button bada hota jayega 😆
    yesSize += 5;
    yesBtn.style.fontSize = yesSize + "px";

    if (navigator.vibrate) {
        navigator.vibrate(50);
    }
}

// YES button logic 😏
function handleYes() {
    yesClicks++;

    if (yesClicks < 3) {
        alert("Itni jaldi kya hai? Thoda or mje lene do 😏");
        return;
    }

    document.getElementById("main-content").style.display = "none";
    document.getElementById("success-message").style.display = "block";
    document.body.style.background = "#ffc1cc";

    startEmojiRain();
}

// Emoji rain 🎉
function startEmojiRain() {
    for (let i = 0; i < 25; i++) {
        let emoji = document.createElement("div");
        emoji.classList.add("emoji");

        emoji.innerText = ["❤️","😍","😘","🎉"][Math.floor(Math.random()*4)];

        emoji.style.left = Math.random() * 100 + "vw";
        emoji.style.animationDuration = (Math.random()*2 + 1) + "s";

        document.body.appendChild(emoji);
    }
}
</script>

</body>
</html>
