<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ek Zaroori Sawal ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #d63384;
            margin-bottom: 20px;
        }

        .gif_container img {
            width: 200px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            height: 100px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background-color: #28a745;
            color: white;
        }

        #noBtn {
            background-color: #dc3545;
            color: white;
            position: absolute;
        }

        #success-message {
            display: none;
        }

        .heart {
            color: #e25555;
        }
    </style>
</head>
<body>

    <div id="main-content" class="container">
        <div class="gif_container">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpobjZ0NjR6YmN6bm96am96bm96am96bm96am96bm96am96JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/c7kaZpDey3D8A5VvIs/giphy.gif" alt="Cute Bear">
        </div>
        <h1> Hello Meri Meenu 😘</h1>
        <h1>Kya tum meri banna chahogi? <span class="heart">❤️</span></h1>
        <p>(Zyada sochna mat, options limited hain! 😂)</p>
        
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Haan!</button>
            <button id="noBtn" onmouseover="moveNoButton()">Nahi</button>
        </div>
    </div>

    <div id="success-message" class="container">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpobjZ0NjR6YmN6bm96am96bm96am96bm96am96bm96am96JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/vO8F4fYK3CN68/giphy.gif" alt="Happy Dance">
        <h1 style="color: #d63384;">Yayyy! I knew it! 😍❤️</h1>
        <p>Ab hum party karenge! Love you!</p>
    </div>

    <script>
        let yesBtnSize = 18;
        let noClicks = 0;

        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            
            // "No" button ki position random set karna
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            // "Yes" button ko bada karna har baar jab wo "No" pe hover karegi
            yesBtnSize += 10;
            yesBtn.style.fontSize = yesBtnSize + 'px';
            yesBtn.style.padding = (yesBtnSize / 1.2) + 'px ' + (yesBtnSize * 1.5) + 'px';
        }

        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('success-message').style.display = 'block';
            document.body.style.backgroundColor = '#ffc1cc';
            
            // Chota sa confetti effect (optional)
            alert("Mubarak ho! Aapne sahi faisla liya hai! 😘");
        }
    </script>
</body>
</html>
